name: ci

on:
  push:
    # Merge targets only: a feature branch is tested by its pull_request event,
    # and a push trigger on it would run the same commit a second time.
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One branch per Moodle version: this branch serves Moodle 5.1 only ($plugin->supported =
  # [501, 501]), so it has one job, with the full PHP x DB matrix. The other versions live on their
  # own MOODLE_*_STABLE branches, each with its own ci.yml.
  # block_dimensions depends on local_dimensions (version.php $plugin->dependencies), installed
  # below from the branch that serves the same Moodle version, and on tool_lp (core).
  ci-501:
    name: Moodle 5.01
    uses: uaiblaine/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '' }}
      moodle-core-branch: MOODLE_501_STABLE
      plugin-dependencies: |
        uaiblaine/moodle-local_dimensions,MOODLE_501_STABLE
