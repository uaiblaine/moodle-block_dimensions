# Mutation spec for the filter line (stage D2 of moodle-dev/docs/filter-line/DIMENSIONS-PLAN.md).
#   mdl mutate moodle-block_dimensions mutations/gates.conf --fast
#
# Each line breaks ONE guard of the filter line and the sweep records which tests go red: the
# line's own module (folding on its own width, the measuring class, the steps, the morph and its
# quiet focus return, Escape, matching, ranking, the suggestion's order of work, the layers under the
# line's measured bottom, the sheet, the chips row, the slash key), filters.js arming one line per
# section (each section's own search and star, the counts the suggestions offer, the scope's hidden
# buckets), state.js (the search per section, the counts without the text), the template's hooks
# and slot order, the shell's one line per section under its heading, the line's context, the
# stylesheet's steps, morph and sheet, and the two language packs.
#
# A pattern is the smallest expression of the guard, never the block around it: a pattern that
# matches nothing takes the whole sweep down at that line. Dry-match every line against the tree
# (perl -0777 -p <script> <file>, compared with the file) after any change to a file a gate names.
# Each JavaScript gate also reddens filter_line_source_test::test_the_builds_are_current, which is
# expected: the mutated source no longer matches the committed build. The source-shape tests read
# amd/src and need no rebuild. The JS harness (tests/jsharness, run.sh --mutants) pins the
# behaviour the spelling below stands for. Written before any sweep: the `#   ->` lines are claims
# until a sweep log confirms them.
#
# tag | file relative to the repo | perl script relative to this directory
fl_js_observes_itself | amd/src/filter_line.js | fl_js_observes_itself.pl
#   -> block_dimensions\output\filter_line_source_test::test_the_line_measures_its_own_width
